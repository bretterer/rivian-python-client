syntax = "proto3";

package rivian.parallax.energy;

// Reverse-engineered `energy.*` RVM payloads; see ../energy.py.

// energy.high_voltage.battery_characteristics
// Fields 1, 3 and 4 are unmapped.
message BatteryCharacteristics {
  int32 field_1 = 1;
  optional BatteryCellType cell_type = 2;
  int32 field_3 = 3;
  int32 field_4 = 4;
  optional float pack_energy = 5; // kWh
  float pack_energy_copy = 6; // kWh; duplicates field 5
}

enum BatteryCellType {
  BATTERY_CELL_TYPE_UNSPECIFIED = 0;
  BATTERY_CELL_50G = 1;
  BATTERY_CELL_53G = 2;
  BATTERY_CELL_G124 = 3;
  BATTERY_CELL_LG_4695 = 4;
}

// energy.high_voltage.battery_state
// Fields 3 and 4 are unmapped.
message BatteryState {
  ChargeState charge_state = 1;
  Temperatures temperatures = 2;
  string field_3 = 3; // always empty
  int32 field_4 = 4;
  optional int32 bms_state_raw = 6; // 4 idle, 5 discharging, 6 charging, others unnamed

  // The doubles carry float32 precision.
  message ChargeState {
    double soc = 1; // percent
    double pack_energy = 2; // kWh
    optional float range = 3; // km; often absent
  }

  message Temperatures {
    float mid = 1; // °C
    float max = 2; // °C
    float min = 3; // °C
  }
}

// energy.low_voltage.battery_state
message LowVoltageBatteryState {
  optional LowVoltageHealth health = 1;
}

enum LowVoltageHealth {
  LOW_VOLTAGE_HEALTH_UNSPECIFIED = 0;
  LOW_VOLTAGE_NORMAL = 1;
  LOW_VOLTAGE_LOW = 2;
}
