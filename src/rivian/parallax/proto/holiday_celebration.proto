syntax = "proto3";

package rivian.parallax.holiday_celebration;

// Reverse-engineered `holiday_celebration.*` RVM payloads; see ../holiday_celebration.py.

// holiday_celebration.car_costume.holiday_celebration_enabled
// Unmapped; empty so far.
message HolidayCelebrationEnabled {}

// holiday_celebration.car_costume.settings
// All fields unknown.
message CarCostumeSettings {
  optional int32 field_1 = 1;
  optional int32 field_2 = 2;
  optional int32 field_3 = 3;
  optional int32 field_6 = 6;
  optional int32 field_7 = 7;
  optional int32 field_9 = 9;
  optional int32 field_11 = 11;
  optional int32 field_12 = 12;
}

// holiday_celebration.car_costume.state
// Fields 2, 3 and 6 are unknown.
message CarCostumeState {
  int32 costume_id = 1; // 0 = none; other ids unmapped
  optional int32 field_2 = 2;
  optional int32 field_3 = 3;
  optional int32 field_6 = 6;
}

// holiday_celebration.mobile_vehicle_settings.halloween_celebration_settings
// Names from the app; most fields have only been sent empty.
message HalloweenCelebrationSettings {
  CostumeTheme costume_theme = 1;
  Int32Value sound_volume = 2;
  BoolValue music_enabled = 3;
  Int32Value music_type = 4;
  StringValue sound_effect = 5;
  optional int32 exterior_sound_effect = 6;
  BoolValue exterior_sounds_muted = 7;
  BoolValue light_show_enabled = 8;
  BoolValue interior_overhead_lights_enabled = 9;
  BoolValue exterior_light_show_enabled = 10;
  StringValue lights_color = 11;
  StringValue car_costume_availability = 12;
  optional bool motion_light_sound_enabled = 13;

  message CostumeTheme {
    optional string theme_name = 1;
  }
  message BoolValue {
    optional bool value = 1;
  }
  message Int32Value {
    optional int32 value = 1;
  }
  message StringValue {
    optional string value = 1;
  }
}
