repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.23
    hooks:
      # Update the uv lockfile
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.10
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      # Regenerate the Parallax protobuf modules; fails (and leaves the
      # regenerated files to add) if they were out of date.
      - id: protoc
        name: Regenerate Parallax protobuf modules
        entry: bash -c 'python -m grpc_tools.protoc --proto_path=src --python_out=src --pyi_out=src src/rivian/parallax/proto/*.proto'
        language: python
        # Keep in sync with the dev dependency in pyproject.toml.
        additional_dependencies: [grpcio-tools==1.84.0]
        files: ^src/rivian/parallax/proto/.*\.(proto|py|pyi)$
        pass_filenames: false
